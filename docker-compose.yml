name: ledgerguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1: the init-time temporary server listens only on the socket, so this
      # doesn't report healthy until the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.2
    environment:
      # Single-node KRaft (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  ledger-service:
    build: ./ledger-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ${LEDGER_DB_PASSWORD}
      LEDGER_API_KEYS: "client:CLIENT:${LEDGER_CLIENT_API_KEY:?},mcp:READONLY:${LEDGER_READONLY_API_KEY:?},agent:ADMIN:${LEDGER_ADMIN_API_KEY:?}"
      LEDGER_MAX_AMOUNT_MINOR: ${LEDGER_MAX_AMOUNT_MINOR:-1000000000}
      LEDGER_IDEMPOTENCY_TTL: ${LEDGER_IDEMPOTENCY_TTL:-PT24H}
    ports:
      - "${LEDGER_PORT:-8080}:8080"

  detector:
    build: ./agent-service
    command: ["/app/.venv/bin/python", "-m", "app.detector"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AGENT_DATABASE_URL: postgresql://agent:${AGENT_DB_PASSWORD}@postgres:5432/agent
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_EVENTS_TOPIC: ledger.events
      # Must equal the simulator's time scale (see .env.example).
      DETECTOR_TIME_SCALE: ${SIM_TIME_SCALE:-3600}

  mcp-server:
    build: ./mcp-server
    restart: on-failure
    depends_on:
      - ledger-service
    environment:
      LEDGER_URL: http://ledger-service:8080
      # READONLY key only: this server cannot move or freeze money.
      LEDGER_READONLY_API_KEY: ${LEDGER_READONLY_API_KEY:?}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_ALLOWED_HOSTS: "mcp-server:*,localhost:*,127.0.0.1:*"

  agent-worker:
    build: ./agent-service
    command: ["/app/.venv/bin/python", "-m", "app.agent.worker"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    environment:
      AGENT_DATABASE_URL: postgresql://agent:${AGENT_DB_PASSWORD}@postgres:5432/agent
      MCP_URL: http://mcp-server:8000/mcp
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-0}
      LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-0}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-4}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-3600}
      # No ledger key of any kind: the worker sees the ledger only through the read-only MCP server.

  agent-api:
    build: ./agent-service
    command: ["/app/.venv/bin/uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8090"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_DATABASE_URL: postgresql://agent:${AGENT_DB_PASSWORD}@postgres:5432/agent
      LEDGER_URL: http://ledger-service:8080
      # The ONLY holder of the ADMIN key: used solely by POST /cases/{id}/decision for FREEZE.
      LEDGER_ADMIN_API_KEY: ${LEDGER_ADMIN_API_KEY:?}
    ports:
      - "${AGENT_API_PORT:-8090}:8090"

volumes:
  pgdata:
  kafkadata:
