spring:
  application:
    name: ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:ledger}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      # Money safety: 10.5 must not silently become 10, and "100" must not become 100.
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

ledger:
  security:
    # name:ROLE:key, comma separated. Roles: CLIENT, READONLY, ADMIN.
    api-keys: ${LEDGER_API_KEYS:}
  transfer:
    max-amount-minor: ${LEDGER_MAX_AMOUNT_MINOR:1000000000}
  idempotency:
    ttl: ${LEDGER_IDEMPOTENCY_TTL:PT24H}
    cleanup-interval: ${LEDGER_IDEMPOTENCY_CLEANUP_INTERVAL:PT10M}
  retry:
    max-retries: 3
  reconcile:
    interval: ${LEDGER_RECONCILE_INTERVAL:PT5M}
  outbox:
    enabled: ${LEDGER_OUTBOX_ENABLED:true}
    topic: ${LEDGER_OUTBOX_TOPIC:ledger.events}
    partitions: 6
    batch-size: 200
    poll-interval: ${LEDGER_OUTBOX_POLL_INTERVAL:PT0.2S}
    send-timeout: PT15S
    retention: P7D
    cleanup-interval: PT1H
  read:
    max-window: P30D
    max-limit: 100
    default-limit: 50
