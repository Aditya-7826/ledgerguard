[project]
name = "mcp-server"
version = "0.1.0"
description = "LedgerGuard READ-ONLY ledger tools over MCP (streamable HTTP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastMCP lives in mcp 1.x; 2.x renamed it MCPServer. Same SDK line as agent-service's MCP client.
    "mcp>=1.9,<2",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
