[project]
name = "simulator"
version = "0.1.0"
description = "LedgerGuard synthetic traffic + fraud scenario generator with ground-truth labels"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
