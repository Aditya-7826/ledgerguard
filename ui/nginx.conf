server {
    listen 80;
    root /usr/share/nginx/html;

    # The UI's only backend: agent-service's cases API (never the ledger).
    location /api/ {
        proxy_pass http://agent-api:8090/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/cases/:id, /accounts/:id, ...) all serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
